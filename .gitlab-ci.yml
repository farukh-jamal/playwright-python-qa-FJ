# Both jobs use the same versions, fixtures, and pytest.ini as a local run.
image: mcr.microsoft.com/playwright/python:v1.63.0-noble

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.qa_tests:
  stage: test
  timeout: 15m
  before_script:
    - python --version
    - python -m pip install -r requirements.txt
    # This also verifies the browser revision matches the pinned Python package.
    - python -m playwright install --with-deps chromium
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - reports/
      - test-results/
    reports:
      junit: reports/junit.xml

smoke:
  extends: .qa_tests
  script:
    - python -m pytest -m smoke

full_regression:
  extends: .qa_tests
  script:
    - python -m pytest -m regression
