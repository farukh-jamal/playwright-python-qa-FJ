{% extends "base.html" %}
{% block title %}{{ product.name }} | Demo Store{% endblock %}
{% block content %}
<h1>{{ product.name }}</h1>
<p>{{ product.description }}</p>
<p aria-label="Price">{{ product.price_cents | money }}</p>
<p>Available stock: {{ product.stock }}</p>
<form action="{{ url_for('cart_add', product_id=product.id) }}" method="post">
  <button type="submit">Add {{ product.name }} to cart</button>
</form>
{% endblock %}
