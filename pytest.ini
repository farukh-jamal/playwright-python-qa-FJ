[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --browser=chromium
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --output=test-results
    --screenshot=only-on-failure
    --full-page-screenshot
    --tracing=retain-on-failure
    --video=retain-on-failure
junit_suite_name = qa_portfolio
markers =
    smoke: Essential login, cart, checkout, and API checks.
    regression: The complete browser and API suite.
    api: HTTP tests using Playwright APIRequestContext.
